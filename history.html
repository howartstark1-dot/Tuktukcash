<!DOCTYPE html>

<html lang="bn"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Tuktukcash - History &amp; Ledger</title>
<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #090e16;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .glow-emerald {
            box-shadow: 0 0 15px rgba(0, 229, 153, 0.25);
        }
    </style>
</head>
<body class="min-h-screen pb-28 flex flex-col justify-between selection:bg-[#00e599]/30">
<div class="w-full max-w-md mx-auto px-4 pt-4">
<!-- Header -->
<header class="flex items-center justify-center py-3 mb-4">
<div class="flex items-center gap-2">
<span class="w-2.5 h-2.5 rounded-full bg-[#00e599] animate-pulse"></span>
<h1 class="text-xl font-bold tracking-wider text-white">TUKTUKCASH</h1>
</div>
</header>
<!-- Balance Ledger Banner -->
<div class="bg-[#171c24] border border-[#232b36] rounded-2xl p-4 mb-4 flex items-center justify-between shadow-lg">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-[#202936] text-[#00e599] flex items-center justify-center text-sm border border-[#2a374a]">
                    📜
                </div>
<div>
<h2 class="text-xs font-bold text-white uppercase tracking-wider">Transaction Ledger</h2>
<p class="text-[10px] text-slate-400">রিয়েলটাইম আর্নিং ও উইথড্র হিস্ট্রি</p>
</div>
</div>
<span class="text-[10px] font-bold text-[#00e599] px-2.5 py-1 rounded-full bg-[#00e599]/15 border border-[#00e599]/30 flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-[#00e599]"></span>
                Live RTDB
            </span>
</div>
<!-- Ledger Summary Cards -->
<div class="grid grid-cols-2 gap-2 mb-4">
<div class="bg-[#121721] border border-[#1e2633] rounded-xl p-3">
<span class="text-[10px] text-slate-400 block mb-0.5">মোট আর্নিং (পয়েন্ট)</span>
<span class="text-base font-bold text-[#00e599]" id="totalEarnText">+0 PTS</span>
</div>
<div class="bg-[#121721] border border-[#1e2633] rounded-xl p-3">
<span class="text-[10px] text-slate-400 block mb-0.5">মোট ক্যাশআউট</span>
<span class="text-base font-bold text-rose-400" id="totalCashoutText">0 PTS</span>
</div>
</div>
<!-- Filter Segmented Tabs -->
<div class="grid grid-cols-3 gap-1 bg-[#121721] p-1 rounded-xl border border-[#232b36] mb-4 text-xs font-semibold">
<button class="py-1.5 bg-[#1f2836] text-white rounded-lg transition-all" id="btnAll" onclick="filterLogs('all')">All</button>
<button class="py-1.5 text-slate-400 rounded-lg hover:text-white transition-all" id="btnEarn" onclick="filterLogs('earn')">Earnings</button>
<button class="py-1.5 text-slate-400 rounded-lg hover:text-white transition-all" id="btnPayout" onclick="filterLogs('payout')">Payouts</button>
</div>
<!-- Transaction List -->
<div class="space-y-2.5" id="txList">
<!-- Dynamically populated or displays empty state -->
</div>
<!-- Security Tag -->
<div class="flex items-center justify-center gap-1.5 mt-6 text-slate-400 text-[11px]">
<span class="text-[#00e599]">🛡️</span>
<span>Firebase RTDB Synchronized Payout History</span>
</div>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 bg-[#0f141c] border-t border-[#1e2633] py-2 z-50">
<div class="max-w-md mx-auto grid grid-cols-3 text-center">
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-white transition-colors" href="index.html">
<div class="w-7 h-7 rounded-full border border-slate-600 flex items-center justify-center mb-0.5">
<svg class="w-3.5 h-3.5 fill-current ml-0.5" viewbox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
</div>
<span class="text-[11px] font-medium">Earn</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-white transition-colors" href="withdraw.html">
<div class="w-7 h-7 flex items-center justify-center mb-0.5">
<svg class="w-6 h-6 stroke-current fill-none" stroke-width="1.8" viewbox="0 0 24 24">
<rect height="13" rx="2" width="18" x="3" y="6"></rect>
<path d="M16 12a1.5 1.5 0 103 0 1.5 1.5 0 00-3 0z" fill="currentColor"></path>
</svg>
</div>
<span class="text-[11px] font-medium">Withdraw</span>
</a>
<a class="flex flex-col items-center justify-center text-[#00e599]" href="history.html">
<div class="w-7 h-7 flex items-center justify-center mb-0.5">
<svg class="w-6 h-6 stroke-[#00e599] fill-none" stroke-width="2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="8"></circle>
<path d="M12 8v4l3 2" stroke-linecap="round"></path>
</svg>
</div>
<span class="text-[11px] font-bold">History</span>
</a>
</div>
</nav>
<script>
        let currentFilter = 'all';

        function updateSummary(history) {
            let totalEarn = 0;
            let totalPayout = 0;

            history.forEach(item => {
                if (item.amount > 0) {
                    totalEarn += Number(item.amount);
                } else if (item.amount < 0) {
                    totalPayout += Math.abs(Number(item.amount));
                }
            });

            const earnEl = document.getElementById('totalEarnText');
            const payoutEl = document.getElementById('totalCashoutText');
            if (earnEl) earnEl.textContent = `+${totalEarn} PTS`;
            if (payoutEl) payoutEl.textContent = `${totalPayout} PTS`;
        }

        function renderLogs() {
            const listContainer = document.getElementById('txList');
            let history = JSON.parse(localStorage.getItem('tx_history') || '[]');
            
            updateSummary(history);

            let filtered = history.filter(item => {
                if(currentFilter === 'earn') return item.amount > 0;
                if(currentFilter === 'payout') return item.amount < 0;
                return true;
            });

            if(filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-[#171c24] border border-[#232b36] rounded-2xl py-12 px-6 text-center flex flex-col items-center justify-center">
                        <div class="w-14 h-14 rounded-2xl bg-[#1b2028] border border-[#252a33] flex items-center justify-center text-2xl mb-3 shadow-inner">
                            <span class="text-[#00e599]/60">📂</span>
                        </div>
                        <h3 class="text-sm font-bold text-white mb-1">কোনো হিস্ট্রি পাওয়া যায়নি</h3>
                        <p class="text-xs text-slate-400 max-w-xs leading-relaxed">
                            আপনার আর্নিং বা উইথড্র লেনদেন এখানে প্রদর্শিত হবে
                        </p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = filtered.map(item => {
                const isEarn = item.amount > 0;
                return `
                    <div class="bg-[#171c24] border border-[#232b36] rounded-xl p-3.5 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg ${isEarn ? 'bg-[#00e599]/15 text-[#00e599] border border-[#00e599]/20' : 'bg-rose-500/15 text-rose-400 border border-rose-500/20'} flex items-center justify-center font-bold text-xs">
                                ${isEarn ? '➕' : '💸'}
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-white">${item.title}</h4>
                                <span class="text-[10px] text-slate-400">${item.date || 'Today'} • ${isEarn ? 'Received' : 'Pending Request'}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold ${isEarn ? 'text-[#00e599]' : 'text-rose-400'} block">
                                ${isEarn ? '+' + item.amount : item.amount} PTS
                            </span>
                            <span class="text-[9px] ${isEarn ? 'text-[#00e599]/80' : 'text-amber-400'} font-medium">
                                ${isEarn ? 'Completed' : 'Processing'}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterLogs(type) {
            currentFilter = type;
            document.getElementById('btnAll').className = type === 'all' ? 'py-1.5 bg-[#1f2836] text-white rounded-lg transition-all' : 'py-1.5 text-slate-400 rounded-lg hover:text-white transition-all';
            document.getElementById('btnEarn').className = type === 'earn' ? 'py-1.5 bg-[#1f2836] text-white rounded-lg transition-all' : 'py-1.5 text-slate-400 rounded-lg hover:text-white transition-all';
            document.getElementById('btnPayout').className = type === 'payout' ? 'py-1.5 bg-[#1f2836] text-white rounded-lg transition-all' : 'py-1.5 text-slate-400 rounded-lg hover:text-white transition-all';
            renderLogs();
        }

        renderLogs();
    </script>
</body></html>
