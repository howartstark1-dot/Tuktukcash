<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuktukcash - History & Ledger</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', '"Hind Siliguri"', 'sans-serif'],
          },
          colors: {
            surface: {
              DEFAULT: '#0f141c',
              dim: '#090e16',
              card: '#171c24',
              elevated: '#1f2530',
              border: '#262e3d'
            },
            primary: {
              DEFAULT: '#00e599',
              hover: '#00c785',
              dark: '#003823'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090e16;
      color: #e2e8f0;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="font-sans antialiased pb-24">
  
  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#090e16]/90 backdrop-blur-md px-4 py-3 border-b border-surface-border flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-2.5 h-2.5 rounded-full bg-primary animate-pulse"></div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white leading-none">TUKTUKCASH</h1>
        <span class="text-[11px] text-slate-400">History & Ledger</span>
      </div>
    </div>
    <span class="text-xs px-2.5 py-1 rounded-full bg-surface-card border border-surface-border text-emerald-400 font-medium flex items-center gap-1">
      <i data-lucide="cloud" class="w-3.5 h-3.5"></i> Synced
    </span>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
    
    <!-- Ledger Overview Card -->
    <div class="bg-surface-card rounded-2xl p-5 border border-surface-border shadow-lg">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Synced Realtime Ledger</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-primary/10 text-primary font-medium">LIVE STREAM</span>
      </div>
      <div class="flex items-baseline gap-2 mb-3">
        <span class="text-3xl font-bold tracking-tight text-white" id="historyBalance">...</span>
        <span class="text-sm font-semibold text-primary">PTS</span>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-3 border-t border-surface-border">
        <div class="bg-surface-elevated p-2.5 rounded-xl border border-surface-border">
          <span class="text-[10px] text-slate-400 block">Total Ad Credits</span>
          <span class="text-sm font-bold text-primary" id="totalCredited">0 PTS</span>
        </div>
        <div class="bg-surface-elevated p-2.5 rounded-xl border border-surface-border">
          <span class="text-[10px] text-slate-400 block">Total Withdrawals</span>
          <span class="text-sm font-bold text-amber-400" id="totalWithdrawn">৳ 0.00</span>
        </div>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="flex rounded-xl bg-surface-card p-1 border border-surface-border">
      <button id="tabAll" class="flex-1 py-1.5 rounded-lg text-xs font-bold bg-primary text-surface-dim transition-all">All Activities</button>
      <button id="tabAds" class="flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">Ad Streams</button>
      <button id="tabPayouts" class="flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">Cashouts</button>
    </div>

    <!-- Feed Container -->
    <div class="space-y-2.5" id="historyFeed">
      <div class="text-center py-10 text-slate-500 text-xs">
        <i data-lucide="loader" class="w-6 h-6 animate-spin mx-auto mb-2 text-primary"></i>
        রেকর্ড লোড হচ্ছে...
      </div>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#090e16]/95 backdrop-blur-lg border-t border-surface-border px-6 py-2">
    <div class="max-w-md mx-auto flex items-center justify-around">
      <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white py-1">
        <i data-lucide="play-circle" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium">Earn</span>
      </a>
      <a href="withdraw.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white py-1">
        <i data-lucide="wallet" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium">Withdraw</span>
      </a>
      <a href="history.html" class="flex flex-col items-center gap-1 text-primary py-1">
        <i data-lucide="history" class="w-5 h-5"></i>
        <span class="text-[11px] font-bold">History</span>
      </a>
    </div>
  </nav>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "guest_user";

    const firebaseConfig = {
      databaseURL: "https://tuktukcash-default-rtdb.firebaseio.com/"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Points Listener
    onValue(ref(db, `users/${userId}/points`), (snapshot) => {
      const pts = snapshot.val() || 0;
      document.getElementById("historyBalance").innerText = Number(pts).toLocaleString();
    });

    // History Listener
    onValue(ref(db, `history/${userId}`), (snapshot) => {
      const data = snapshot.val();
      const feed = document.getElementById("historyFeed");
      feed.innerHTML = "";

      if (!data) {
        feed.innerHTML = `
          <div class="text-center py-10 bg-surface-card rounded-2xl border border-surface-border text-slate-500 text-xs">
            <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
            এখনও কোনো লেনদেন সম্পন্ন হয়নি।
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const list = Object.entries(data).reverse();
      let creditSum = 0;
      let withdrawSum = 0;

      list.forEach(([key, item]) => {
        const isWithdraw = item.type === "withdrawal";
        const dateStr = new Date(item.timestamp || parseInt(key)).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        if (isWithdraw) {
          withdrawSum += (item.amountBdt || Math.abs(item.points) / 100);
        } else {
          creditSum += (item.points || 0);
        }

        const card = document.createElement("div");
        card.className = "bg-surface-card p-3.5 rounded-xl border border-surface-border flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl ${isWithdraw ? 'bg-amber-500/10 text-amber-400' : 'bg-primary/10 text-primary'} flex items-center justify-center shrink-0">
              <i data-lucide="${isWithdraw ? 'arrow-up-right' : 'play'}" class="w-5 h-5"></i>
            </div>
            <div>
              <div class="text-sm font-bold text-white">${item.title || (isWithdraw ? 'Withdrawal' : 'Ad Reward')}</div>
              <div class="text-[11px] text-slate-400">${dateStr} • <span class="${item.status === 'Pending' ? 'text-amber-400' : 'text-primary'}">${item.status || 'Success'}</span></div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-sm font-bold ${isWithdraw ? 'text-amber-400' : 'text-primary'}">
              ${isWithdraw ? '-' + Math.abs(item.points) : '+' + item.points} PTS
            </div>
            <div class="text-[10px] text-slate-400">
              ${isWithdraw ? '৳' + (item.amountBdt || Math.abs(item.points)/100).toFixed(2) : 'Credited'}
            </div>
          </div>
        `;
        feed.appendChild(card);
      });

      document.getElementById("totalCredited").innerText = `+${creditSum} PTS`;
      document.getElementById("totalWithdrawn").innerText = `৳ ${withdrawSum.toFixed(2)}`;
      lucide.createIcons();
    });

    lucide.createIcons();
  </script>
</body>
</html>
